name: Backup Mirror

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  BACKUP_REPO: "SOLARIUM-Collective/solarexterminatorius"
  BACKUP_PAT: ${{ secrets.UPSTREAM_MIRROR_PAT || secrets.UPSTREAM_MIRROR_SOLARIUM }}

jobs:
  backup:
    name: Mirror all refs to backup
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout all history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Fetch remaining branches and tags
        shell: bash
        run: |
          set -uo pipefail
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*' || exit 1
          AUTH="$(printf 'x-access-token:%s' "$BACKUP_PAT" | base64 -w0)"
          git config --global http.version HTTP/1.1
          git config --global http.postBuffer 524288000
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 60
          git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic ${AUTH}"
          attempt=0
          until git push --prune "https://github.com/${BACKUP_REPO}.git" \
              '+refs/remotes/origin/*:refs/heads/*' '+refs/tags/*:refs/tags/*'; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 3 ]; then
              echo "push упёрся в ошибку три раза подряд" >&2
              exit 1
            fi
            echo "push не удался (попытка ${attempt}/3), сплю 30с и повторяю..."
            sleep 30
          done
          git count-objects -v | grep -E '^(count|size-pack):'