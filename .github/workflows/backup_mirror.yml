name: Backup Mirror

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  BACKUP_REPO: "SOLARIUM-Collective/solarexterminatorius"
  BACKUP_PAT: ${{ secrets.UPSTREAM_MIRROR_PAT || secrets.UPSTREAM_MIRROR_SOLARIUM }}

jobs:
  backup:
    name: Mirror all refs to backup
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Mirror all branches and tags
        shell: bash
        env:
          SRC_REPO: "SOLARIUM-Collective/Solarium-Voidcrew"
        run: |
          set -uo pipefail
          [ -n "$BACKUP_PAT" ] || exit 1
          git config --global http.version HTTP/1.1
          git config --global http.postBuffer 524288000
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 60
          BK="/tmp/solarium-backup.git"
          attempt=0
          until git clone --mirror "https://github.com/${SRC_REPO}.git" "$BK"; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 3 ]; then
              echo "clone упёрся в 500 три раза подряд" >&2
              exit 1
            fi
            echo "клонирование не удалось (попытка ${attempt}/3), сплю 30с и повторяю..."
            rm -rf "$BK"
            sleep 30
          done
          AUTH="$(printf 'x-access-token:%s' "$BACKUP_PAT" | base64 -w0)"
          git -C "$BK" config http.https://github.com/.extraheader "AUTHORIZATION: basic ${AUTH}"
          git -C "$BK" push --prune --mirror "https://github.com/${BACKUP_REPO}.git"
          git -C "$BK" count-objects -v | grep -E '^(count|size-pack):'