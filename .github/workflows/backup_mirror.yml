name: Solar Exterminatorius

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  BACKUP_REPO: "SOLARIUM-Collective/solarexterminatorius"
  BACKUP_SSH_KEY: ${{ secrets.BACKUP_SSH_KEY }}

jobs:
  backup:
    name: Mirror all refs to backup
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout all history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Fetch remaining branches and tags
        shell: bash
        run: |
          set -uo pipefail
          [ -n "$BACKUP_SSH_KEY" ] || exit 1
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*' || exit 1
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$BACKUP_SSH_KEY" > ~/.ssh/backup_key
          chmod 600 ~/.ssh/backup_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/backup_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          URL="git@github.com:${BACKUP_REPO}.git"
          if ! git push --prune "$URL" '+refs/remotes/origin/*:refs/heads/*' >/tmp/push.log 2>&1; then
            cat /tmp/push.log
            echo "=> первичный пуш не прошёл (лимит pack 2GiB), секвуем историю частями"
            seeded=0
            while read -r sha; do
              seeded=$((seeded + 1))
              if [ $((seeded % 500)) -eq 0 ]; then
                echo "seed: ${seeded} коммитов..."
                git push --force "$URL" "${sha}:refs/backup-seed/pending" || exit 1
              fi
            done < <(git rev-list --topo-order --reverse refs/remotes/origin/master)
            last="$(git rev-list -n1 refs/remotes/origin/master)"
            git push --force "$URL" "${last}:refs/backup-seed/pending" || exit 1
            echo "сев завершён, повторяю зеркальный пуш"
            git push --prune "$URL" '+refs/remotes/origin/*:refs/heads/*' || exit 1
            git push "$URL" --delete refs/backup-seed/pending >/dev/null 2>&1 || true
          fi
          git tag "snapshot/$(date -u +%F)" refs/remotes/origin/master 2>/dev/null || true
          git push "$URL" '+refs/tags/*:refs/tags/*' || exit 1
          git count-objects -v | grep -E '^(count|size-pack):'