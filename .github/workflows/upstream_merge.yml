name: Слияние апстрима

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      base_branch:
        description: "Ветка, в которую вливается upstream/master"
        required: false
        default: "stream_update"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-merge
  cancel-in-progress: false

env:
  BASE_BRANCH: ${{ inputs.base_branch || 'stream_update' }}
  UPSTREAM_MIRROR_PAT: ${{ secrets.UPSTREAM_MIRROR_PAT || secrets.UPSTREAM_MIRROR_SOLARIUM || github.token }}
  GITHUB_TOKEN: ${{ secrets.UPSTREAM_MIRROR_PAT || secrets.UPSTREAM_MIRROR_SOLARIUM || github.token }}
  UPSTREAM_MERGE_LABEL: "🆙 Обновление апстрима"

jobs:
  merge:
    name: Слияние upstream/master в ветку
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Получение кода
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_MIRROR_PAT || secrets.UPSTREAM_MIRROR_SOLARIUM || github.token }}
      - name: Запуск слияния апстрима
        shell: bash
        run: bash .github/scripts/upstream_merge.sh
