name: Mirror Upstream PRs

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      catchup_all:
        description: "Зеркалить ВСЕ непринятые ПРы апстрима (без окна по времени)"
        required: false
        default: false
        type: boolean
      window_hours:
        description: "Зеркалить ПРы, принятые в апстриме за последние N часов (если catchup_all=false)"
        required: false
        default: "2"
      max_per_run:
        description: "Максимум ПРов за один запуск"
        required: false
        default: "10"
      base_branch:
        description: "Ветка, в которую открываются зеркальные ПРы"
        required: false
        default: "stream_update"

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: upstream-mirror
  cancel-in-progress: false

env:
  BASE_BRANCH: ${{ inputs.base_branch || 'stream_update' }}
  CATCHUP_ALL: ${{ inputs.catchup_all || 'false' }}
  WINDOW_HOURS: ${{ inputs.window_hours || '2' }}
  MAX_PER_RUN: ${{ inputs.max_per_run || '10' }}
  UPSTREAM_MIRROR_PAT: ${{ secrets.UPSTREAM_MIRROR_PAT }}

jobs:
  mirror:
    name: Mirror accepted upstream PRs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Mirror accepted upstream PRs
        shell: bash
        run: bash .github/scripts/upstream_mirror.sh
